<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Lonas – Pahame</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #EEEEEE; color: #111; min-height: 100vh; padding: 16px; }
.card { background: #FFFFFF; border: 1.5px solid #BBBBBB; border-radius: 8px; max-width: 680px; margin: 0 auto; overflow: hidden; }
.header { background: #FFFFFF; border-bottom: 2px solid #111; padding: 14px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.header img.logo { height: 62px; width: auto; object-fit: contain; }
.header-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #111; border-left: 2px solid #111; padding-left: 10px; line-height: 1.5; }
.meta-bar { background: #F0F0F0; border-bottom: 1.5px solid #BBBBBB; padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.meta-field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #111; }
.meta-field label { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.meta-field input { border: 1.5px solid #AAAAAA; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #111; }
.meta-field input:focus { outline: none; border-color: #111; }
.sep { color: #AAAAAA; font-size: 16px; }
.body { padding: 18px 20px; }
.section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 5px; margin-top: 14px; }
.destino-select, .bodega-input {
width: 100%; padding: 9px 12px; border: 1.5px solid #AAAAAA; border-radius: 6px; font-size: 14px; font-weight: 600; color: #111; background: #FFFFFF;
}
.bodega-input:focus { outline: none; border-color: #111; }
.articulos-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.articulo-card { border: 1.5px solid #BBBBBB; border-radius: 8px; padding: 12px; background: #FAFAFA; position: relative; }
.articulo-num { font-size: 10px; font-weight: 800; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.articulo-campo { margin-bottom: 8px; }
.articulo-campo:last-of-type { margin-bottom: 0; }
.articulo-campo label { display: block; font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
.articulo-campo input { width: 100%; border: 1.5px solid #CCCCCC; border-radius: 6px; padding: 10px 12px; font-size: 15px; color: #111; background: #FFFFFF; -webkit-appearance: none; appearance: none; }
.articulo-campo input:focus { outline: none; border-color: #111; }
.btn-del { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid #DDD; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; color: #BBB; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0; }
.btn-del:active { background: #EEE; color: #555; }
.btn-add-row { width: 100%; margin-top: 8px; padding: 13px; border: 1.5px dashed #BBBBBB; border-radius: 8px; background: transparent; color: #888; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
.btn-add-row:active { border-color: #555; color: #111; background: #F5F5F5; }
.firmas3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
.firma-box { border: 1.5px solid #BBBBBB; border-radius: 6px; padding: 12px; background: #F9F9F9; }
.firma-box .section-label { margin-top: 0; }
.firma-input { width: 100%; border: 1.5px solid #CCCCCC; border-radius: 5px; padding: 7px 10px; font-size: 13px; background: #FFFFFF; color: #111; margin-top: 5px; }
.firma-input:focus { outline: none; border-color: #555; }
.firma-line { border-top: 1.5px solid #111; margin: 14px 0 6px; }
.actions { display: flex; gap: 12px; margin-top: 20px; padding-top: 14px; border-top: 1.5px solid #DDDDDD; }
.btn { flex: 1; padding: 12px 10px; border: 1.5px solid #111; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
.btn-limpiar { background: #FFFFFF; color: #111; }
.btn-limpiar:hover { background: #F0F0F0; }
.btn-pdf { background: #111; color: #FFFFFF; }
.btn-pdf:hover { background: #333; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #111; color: #FFF; padding: 11px 22px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.25); transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
.volver { display: inline-block; margin: 0 auto 10px; max-width: 680px; width: 100%; }
.volver a { color: #444; font-size: 13px; text-decoration: none; font-weight: 600; }
.volver a:hover { text-decoration: underline; }
@media (max-width: 480px) {
body { padding: 8px; }
.header { flex-direction: column; align-items: flex-start; }
.meta-bar { flex-direction: column; align-items: flex-start; }
.firmas3 { grid-template-columns: 1fr; }
.actions { flex-direction: column; }
}
</style>
</head>

// ── API CLOUD (mismo backend de Pahame)
const API_URL = 'https://script.google.com/macros/s/AKfycbzKklWfuBXRkqgVwxL8nNgWm3m8lTN1ZLeOhqK4RgT41stMeqhv9ZLNSe_nlB_dzS6D9w/exec';
async function apiGet(params) {
const qs = new URLSearchParams(params).toString();
const res = await fetch(`${API_URL}?${qs}`);
return res.json();
}
async function apiPost(data) {
const res = await fetch(API_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify(data)
});
return res.json();
}

// ── FECHA AUTOMÁTICA
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hoy = new Date();
document.getElementById('fecha').value =
`${DIAS[hoy.getDay()]} ${hoy.getDate()} de ${MESES[hoy.getMonth()]} del ${hoy.getFullYear()}`;

// ── CORRELATIVO CLOUD (bodega fija 'SL' = Solicitud de Lonas)
function generarCorrelativo() {
const campo = document.getElementById('numero');
campo.readOnly = true;
campo.value = 'Generando…';
apiGet({ action: 'siguienteNumero', bodega: 'SL' }).then(data => {
if (data && data.numero) {
campo.value = data.numero;
campo.readOnly = false;
} else {
campo.readOnly = false;
campo.value = 'SL-';
campo.placeholder = 'SL-001';
mostrarToast('⚠️ Sin conexión, escribe el número manualmente');
}
}).catch(() => {
campo.readOnly = false;
campo.value = 'SL-';
campo.placeholder = 'SL-001';
mostrarToast('⚠️ Sin conexión, escribe el número manualmente');
});
}
generarCorrelativo();

// ── TABLA (Cantidad, Producto, Plataforma, Cliente, Observaciones)
let filas = 0;
function agregarFila(cant='', prod='', plat='', cli='', obs='') {
filas++;
const lista = document.getElementById('tabla-body');
const card = document.createElement('div');
card.className = 'articulo-card';
card.id = `fila-${filas}`;
card.innerHTML = `
<div class="articulo-num">Producto #<span class="num-label">${filas}</span></div>
<button class="btn-del" onclick="eliminarFila('fila-${filas}')" type="button">✕</button>
<div class="articulo-campo"><label>Cantidad</label><input type="text" inputmode="text" autocomplete="off" placeholder="Ej. 5" value="${cant}"></div>
<div class="articulo-campo"><label>Producto</label><input type="text" inputmode="text" autocomplete="off" placeholder="Ej. Lonas 20x50" value="${prod}"></div>
<div class="articulo-campo"><label>Plataforma</label><input type="text" inputmode="text" autocomplete="off" placeholder="Ej. 2" value="${plat}"></div>
<div class="articulo-campo"><label>Cliente</label><input type="text" inputmode="text" autocomplete="off" placeholder="Ej. Revca Glambulk" value="${cli}"></div>
<div class="articulo-campo"><label>Observaciones</label><input type="text" inputmode="text" autocomplete="off" placeholder="Ej. Recepción de níquel" value="${obs}"></div>
`;
lista.appendChild(card);
renumerarFilas();
}

function eliminarFila(id) {
const el = document.getElementById(id);
if (el) el.remove();
renumerarFilas();
}

function renumerarFilas() {
document.querySelectorAll('#tabla-body .articulo-card').forEach((card, i) => {
card.querySelector('.num-label').textContent = i + 1;
});
}

agregarFila(); agregarFila(); agregarFila();

// ── LIMPIAR
function limpiarForm() {
if (!confirm('¿Limpiar todo el formulario?')) return;
document.getElementById('tabla-body').innerHTML = '';
filas = 0;
agregarFila(); agregarFila(); agregarFila();
document.getElementById('bodega-destino').value = 'Bodega No. 1, Pahame S.A.';
document.getElementById('supervisor-patio').value = '';
document.getElementById('gerente-terminal').value = '';
document.getElementById('encargado-bodega').value = '';
document.getElementById('numero').value = '';
document.getElementById('numero').placeholder = 'SL-001';
generarCorrelativo();
}

// ── TOAST
function mostrarToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2800);
}

// ── GENERAR PDF (mismo formato de la carta original en papel, con logo grande y correlativo)
function generarPDF() {
const numero = document.getElementById('numero').value.trim();
if (!numero || numero === 'SL-') { mostrarToast('⚠️ Ingresa el número de solicitud'); document.getElementById('numero').focus(); return; }

const bodegaDestino = document.getElementById('bodega-destino').value.trim();
if (!bodegaDestino) { mostrarToast('⚠️ Indica la bodega del requerimiento'); document.getElementById('bodega-destino').focus(); return; }

const cards = document.querySelectorAll('#tabla-body .articulo-card');
const items = [];
cards.forEach((card, i) => {
const inputs = card.querySelectorAll('input');
const cant = inputs[0].value.trim();
const prod = inputs[1].value.trim();
const plat = inputs[2].value.trim();
const cli = inputs[3].value.trim();
const obs = inputs[4].value.trim();
if (cant || prod || plat || cli || obs) items.push([cant, prod, plat, cli, obs]);
});
if (items.length === 0) { mostrarToast('⚠️ Agrega al menos un producto'); return; }

const supervisorPatio = document.getElementById('supervisor-patio').value.trim();
const gerenteTerminal = document.getElementById('gerente-terminal').value.trim();
const encargadoBodega = document.getElementById('encargado-bodega').value.trim();

const lugar = document.getElementById('lugar').value || 'Santo Tomás de Castilla';
const fecha = document.getElementById('fecha').value;

const { jsPDF } = window.jspdf;
const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
const W = doc.internal.pageSize.getWidth();
const pageH = doc.internal.pageSize.getHeight();

// Logo grande, proporción real (347x248px) para que no se vea distorsionado
const logoW = 52;
const logoH = logoW / (347/248);
try { doc.addImage(LOGO_DATA, 'JPEG', 14, 14, logoW, logoH); } catch(e) {}

// Lugar / fecha / correlativo, arriba a la derecha (igual que la carta original + el número)
doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
doc.text(lugar.toUpperCase(), W-14, 20, { align:'right' });
doc.text(fecha.toUpperCase(), W-14, 26, { align:'right' });
doc.setFontSize(9);
doc.text(`No. ${numero}`, W-14, 32, { align:'right' });

let y = 14 + logoH + 18;

// Requerimiento
doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
doc.text('REQUERIMIENTO:', 14, y);
y += 6;
const partesReq = bodegaDestino.split(',');
const reqLinea1 = ('A ' + (partesReq[0] || '').trim()).toUpperCase();
const reqLinea2 = (partesReq.slice(1).join(',') || '').trim().toUpperCase();
doc.text(reqLinea1, 14, y);
y += 6;
if (reqLinea2) { doc.text(reqLinea2, 14, y); y += 6; }
y += 8;

// Intro
doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0);
doc.text('Por este medio se SOLICITA la entrega de los bienes descritos a continuación:', 14, y, { maxWidth: W-28 });
y += 14;

// Tabla (misma que la carta original: bordes negros, sin relleno de color)
doc.autoTable({
startY: y,
head: [['CANT.','PRODUCTO','PLATAFORMA','CLIENTE','OBSERVACIONES']],
body: items,
theme: 'grid',
styles: { font:'helvetica', fontSize:9.5, cellPadding:4, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.4, halign:'center', valign:'middle' },
headStyles: { fillColor:[255,255,255], textColor:[0,0,0], fontStyle:'bold', lineColor:[0,0,0], lineWidth:0.4 },
bodyStyles: { fillColor:[255,255,255] },
columnStyles: { 0:{cellWidth:20}, 1:{cellWidth:45}, 2:{cellWidth:28}, 3:{cellWidth:40}, 4:{cellWidth:'auto'} },
margin: { left:14, right:14 },
});

y = doc.lastAutoTable.finalY + 35;
if (y > pageH - 75) { doc.addPage(); y = 30; }

// Cierre
doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
doc.text('Agradecido se sirva darle trámite al presente.', 14, y);
y += 28;

// Firmas: F. ______ (Supervisor de patio / Gerente Terminal) lado a lado, igual que la carta original
const lineW = 62;
const col2X = 112;

doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0);
doc.text('F.', 14, y);
doc.line(19, y, 19 + lineW, y);
doc.text('F.', col2X, y);
doc.line(col2X + 5, y, col2X + 5 + lineW, y);

doc.setFont('helvetica','bold'); doc.setFontSize(9);
doc.text('Supervisor de patio', 19 + lineW/2, y + 6, { align:'center' });
doc.text('Gerente Terminal', col2X + 5 + lineW/2, y + 6, { align:'center' });

y += 26;

// Fila 2: Encargado de bodega
doc.setFont('helvetica','normal'); doc.setFontSize(10);
doc.text('F.', 14, y);
doc.line(19, y, 19 + lineW, y);
doc.setFont('helvetica','bold'); doc.setFontSize(9);
doc.text('Encargado de bodega', 19 + lineW/2, y + 6, { align:'center' });

apiPost({
action: 'guardarLona',
numero, bodegaKey: 'SL', fecha, lugar, bodegaDestino,
items, supervisorPatio, gerenteTerminal, encargadoBodega,
generadoPor: encargadoBodega || supervisorPatio || gerenteTerminal || ''
}).catch(() => {});
